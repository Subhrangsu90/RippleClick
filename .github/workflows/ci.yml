name: CI

on:
    pull_request:
    push:
        branches:
            - main

jobs:
    check:
        runs-on: windows-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check project
              run: npm run check
